aid: li-cor-intermediate
name: LI-COR Intermediate
description: >-
  LI-COR Intermediate, Inc. is the Battery Ventures-backed holding entity for LI-COR, a Lincoln,
  Nebraska environmental and life-science instrumentation maker founded more than fifty years ago.
  The group operates under two brands: LI-COR Environmental (licor.com), which builds greenhouse-gas
  analyzers, eddy-covariance flux systems, photosynthesis and soil-gas instruments, and the HOBO
  line of data loggers; and LICORbio (licorbio.com), which builds Western blot imaging systems and
  infrared fluorescent dyes and reagents. Its instruments are cited in more than 73,000 research
  publications and used across 1,200+ universities in 150+ countries. The connected-device side of
  the business runs through LI-COR Cloud (licor.cloud, formerly HOBOlink), which exposes a public
  read-only HOBOLINK External API for pulling logger and sensor observations into customer systems.
